services:
  db:
    image: mongo
    container_name: photoshare_db
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photoshare_network 

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: photoshare_api
    ports:
      - "3001:3001"
    restart: unless-stopped
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - photoshare_network 

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: photoshare_client
    ports:
      - "5173:5173"
    restart: unless-stopped
    depends_on:
      - api       
    networks:
      - photoshare_network 

volumes:
  mongo_data:

networks:
  photoshare_network: